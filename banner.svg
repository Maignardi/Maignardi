<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Matheus Maignardi - Mobile Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="0.5" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a66bff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a4d"/>
      <stop offset="1" stop-color="#151d38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade1 { opacity: 0; animation: in 0.9s ease-out 0.1s forwards; }
      .fade2 { opacity: 0; animation: in 0.9s ease-out 0.4s forwards; }
      .fade3 { opacity: 0; animation: in 0.9s ease-out 0.7s forwards; }
      .fade4 { opacity: 0; animation: in 0.9s ease-out 1.0s forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 1003px 160px; }
      @keyframes pulse { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      .scan { animation: scan 3.2s linear infinite; }
      @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(190px); opacity: 0; } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .orbit { animation: spin 18s linear infinite; transform-origin: 1003px 160px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="1003" cy="160" r="190" fill="url(#glow)"/>
    <rect x="0" y="314" width="1200" height="6" fill="url(#accent)"/>

    <!-- Text block -->
    <g class="t">
      <text x="70" y="88" class="m fade1" font-size="17" fill="#3ddc84">&gt; hello, world_<tspan class="caret" fill="#3ddc84">|</tspan></text>
      <text x="68" y="150" class="fade2" font-size="56" font-weight="800" fill="#ffffff">Matheus Maignardi</text>
      <text x="70" y="192" class="fade3" font-size="24" font-weight="600" fill="url(#accent)">Mobile Engineer · Android · iOS · React Native · Flutter</text>
      <text x="70" y="226" class="fade3" font-size="17" fill="#aab4d4">Building apps for millions of users and open-source tools that keep them secure.</text>

      <g class="fade4 m" font-size="13" font-weight="600">
        <rect x="70" y="250" width="92" height="28" rx="14" fill="#3ddc84" fill-opacity="0.14" stroke="#3ddc84" stroke-opacity="0.5"/>
        <text x="116" y="268.5" text-anchor="middle" fill="#3ddc84">Kotlin</text>
        <rect x="172" y="250" width="86" height="28" rx="14" fill="#f05138" fill-opacity="0.14" stroke="#f05138" stroke-opacity="0.5"/>
        <text x="215" y="268.5" text-anchor="middle" fill="#ff7a63">Swift</text>
        <rect x="268" y="250" width="100" height="28" rx="14" fill="#4f8cff" fill-opacity="0.14" stroke="#4f8cff" stroke-opacity="0.5"/>
        <text x="318" y="268.5" text-anchor="middle" fill="#7fb0ff">C++20</text>
        <rect x="378" y="250" width="132" height="28" rx="14" fill="#61dafb" fill-opacity="0.12" stroke="#61dafb" stroke-opacity="0.5"/>
        <text x="444" y="268.5" text-anchor="middle" fill="#8be6ff">TypeScript</text>
        <rect x="520" y="250" width="160" height="28" rx="14" fill="#a66bff" fill-opacity="0.14" stroke="#a66bff" stroke-opacity="0.5"/>
        <text x="600" y="268.5" text-anchor="middle" fill="#c7a4ff">Mobile Security</text>
      </g>
    </g>

    <!-- Orbit ring -->
    <g class="orbit" fill="none">
      <circle cx="1003" cy="160" r="128" stroke="#4f8cff" stroke-opacity="0.18" stroke-dasharray="4 10"/>
      <circle cx="1131" cy="160" r="5" fill="#3ddc84"/>
      <circle cx="875" cy="160" r="4" fill="#a66bff"/>
    </g>

    <!-- Phone with shield -->
    <g class="float">
      <rect x="943" y="52" width="120" height="216" rx="20" fill="#0e1428" stroke="url(#accent)" stroke-width="3"/>
      <rect x="953" y="66" width="100" height="188" rx="12" fill="url(#screen)"/>
      <rect x="988" y="58" width="30" height="4" rx="2" fill="#2a355c"/>
      <rect x="953" y="70" width="100" height="2" fill="#3ddc84" fill-opacity="0.8" class="scan"/>
      <g class="pulse">
        <path d="M1003 118 L1033 129 L1033 156 C1033 176 1020 191 1003 198 C986 191 973 176 973 156 L973 129 Z" fill="#3ddc84" fill-opacity="0.15" stroke="#3ddc84" stroke-width="2.5"/>
        <path d="M990 158 L999 167 L1017 147" fill="none" stroke="#3ddc84" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <rect x="968" y="214" width="70" height="6" rx="3" fill="#2a355c"/>
      <rect x="978" y="228" width="50" height="6" rx="3" fill="#2a355c"/>
    </g>
  </g>
</svg>
